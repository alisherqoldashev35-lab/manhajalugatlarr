<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manhaj A1</title>
  <style>
    :root {
      --bg: #07090f;
      --surface: #101420;
      --surface-2: #181e2e;
      --border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #16a34a;
      --green-bright: #22c55e;
      --gold: #f59e0b;
      --blue: #3b82f6;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 70px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-size: 1.5rem;
      color: #ffffff;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .controls-top {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 14px;
      font-size: 0.9rem;
    }

    .btn-green {
      background: linear-gradient(135deg, var(--green), var(--green-bright));
      color: #ffffff;
      padding: 13px 22px;
      font-size: 1rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, var(--blue));
      color: #ffffff;
      padding: 11px 18px;
      font-size: 0.95rem;
    }

    .btn-gold {
      background: linear-gradient(135deg, #d97706, var(--gold));
      color: #09090b;
      padding: 14px 22px;
      font-size: 1rem;
      font-weight: 700;
    }

    .wahda-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }

    .wahda-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      text-align: left;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 150px;
    }

    .wahda-card.unlocked:hover {
      border-color: rgba(34, 197, 94, 0.7);
      background: #151b2b;
    }

    .wahda-card.locked {
      opacity: 0.52;
      background: #0b0d14;
    }

    .wahda-card.completed {
      border-color: rgba(34, 197, 94, 0.55);
    }

    .wahda-num {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .wahda-ar-title {
      direction: rtl;
      text-align: left;
      color: #fbbf24;
      font-size: 0.98rem;
      margin-bottom: 3px;
    }

    .wahda-sub {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      width: fit-content;
    }

    .badge-open {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
    }

    .badge-done {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
    }

    .badge-lock {
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
    }

    .review-box {
      margin-top: 26px;
      background: linear-gradient(145deg, #1a150b, #101420);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
    }

    .progress-wrap {
      margin-bottom: 18px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 7px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress-track {
      height: 8px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--green-bright));
      transition: width 0.25s ease;
    }

    .word-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 0 6px;
    }

    .kind-tag {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.16);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .visual-box {
      width: 116px;
      height: 116px;
      border-radius: 22px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      margin-bottom: 16px;
    }

    .arabic-word {
      font-size: 2.45rem;
      font-weight: 700;
      direction: rtl;
      margin-bottom: 8px;
    }

    .meaning-uz {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fbbf24;
      margin-bottom: 20px;
    }

    .study-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .quiz-type-badge {
      display: inline-block;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.18);
      color: #d8b4fe;
      margin-bottom: 12px;
    }

    .quiz-prompt {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .quiz-prompt.ar-big {
      font-size: 2.25rem;
      direction: rtl;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .opt-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px;
      font-size: 1rem;
      text-align: center;
    }

    .opt-btn.correct {
      background: rgba(34, 197, 94, 0.22);
      border-color: var(--green-bright);
      color: #bbf7d0;
    }

    .opt-btn.wrong {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--red);
      color: #fecaca;
    }

    .text-input {
      width: 100%;
      max-width: 440px;
      background: var(--surface-2);
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 1.25rem;
      direction: rtl;
      margin-bottom: 12px;
    }

    .match-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-item {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: 12px;
      font-size: 1rem;
    }

    .match-item.selected {
      border-color: var(--blue);
      background: rgba(59, 130, 246, 0.22);
    }

    .match-item.matched {
      border-color: var(--green-bright);
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
    }

    .feedback {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
    }

    .feedback.ok {
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .feedback.err {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .result-box {
      text-align: center;
      padding: 18px 8px;
    }

    .score-big {
      font-size: 3rem;
      font-weight: 800;
      margin: 10px 0;
    }

    @media (max-width: 600px) {
      .match-board {
        grid-template-columns: 1fr;
      }
      .arabic-word {
        font-size: 2.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="panel">
      <h2 style="margin-bottom:8px;">Manhaj A1 yuklanmoqda...</h2>
      <p style="color:#94a3b8;">Agar sahifa bir necha soniyadan keyin ham o‘zgarmasa, brauzerni yangilang.</p>
    </div>
  </div>

  <script>
    (function () {
      const appEl = document.getElementById("app");

      window.addEventListener("error", function (event) {
        if (!appEl) return;
        appEl.innerHTML = `
          <div class="panel">
            <h2 style="color:#fca5a5; margin-bottom:8px;">Sahifada kichik xato aniqlandi</h2>
            <p style="color:#94a3b8; margin-bottom:14px;">${String(event.message || "Noma’lum xato")}</p>
            <button class="btn-primary" onclick="location.reload()">Sahifani yangilash</button>
          </div>
        `;
      });

      const Sound = {
        ctx: null,
        enabled: true,
        getCtx() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === "suspended") {
              this.ctx.resume();
            }
            return this.ctx;
          } catch (e) {
            return null;
          }
        },
        tone(freq, duration, type, delay, gainVal) {
          if (!this.enabled) return;
          const c = this.getCtx();
          if (!c) return;
          try {
            const now = c.currentTime + delay;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(gainVal, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now);
            osc.stop(now + duration);
          } catch (e) {}
        },
        toggle() {
          this.enabled = !this.enabled;
          return this.enabled;
        },
        click() {
          this.tone(520, 0.06, "triangle", 0, 0.08);
        },
        learned() {
          this.tone(523.25, 0.1, "sine", 0, 0.12);
          this.tone(659.25, 0.14, "sine", 0.09, 0.12);
        },
        correct() {
          this.tone(587.33, 0.1, "triangle", 0, 0.13);
          this.tone(880, 0.18, "triangle", 0.08, 0.13);
        },
        wrong() {
          this.tone(220, 0.16, "sawtooth", 0, 0.1);
          this.tone(175, 0.22, "sawtooth", 0.12, 0.1);
        },
        unlock() {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
            this.tone(f, 0.14, "triangle", idx * 0.08, 0.12);
          });
        }
      };

      function getVisualSvg(wahdaId, kind) {

          "#3b82f6", "#22c55e", "#f59e0b", "#a855f7",
          "#ec4899", "#06b6d4", "#eab308", "#10b981",
          "#f97316", "#ef4444", "#8b5cf6", "#14b8a6"
        ];
        const color = palette[(wahdaId - 1) % palette.length];
        if (kind === "Ibora / Tarkib") {
          return `<svg width="62" height="62" viewBox="0 0 64 64" fill="none">
            <rect x="10" y="14" width="44" height="28" rx="9" fill="${color}" fill-opacity="0.24" stroke="${color}" stroke-width="2.5"/>
            <polygon points="22,42 31,42 20,52" fill="${color}"/>
            <circle cx="23" cy="28" r="2.5" fill="#fff"/>
            <circle cx="32" cy="28" r="2.5" fill="#fff"/>
            <circle cx="41" cy="28" r="2.5" fill="#fff"/>
          </svg>`;
        }
        return `<svg width="62" height="62" viewBox="0 0 64 64" fill="none">
          <path d="M12 16c7-2 14 0 20 5 6-5 13-7 20-5v30c-7-2-14 0-20 5-6-5-13-7-20-5V16z" fill="${color}" fill-opacity="0.28" stroke="${color}" stroke-width="2.5"/>
          <line x1="32" y1="21" x2="32" y2="51" stroke="#fff" stroke-width="2"/>
        </svg>`;
      }

          ],

            ["سَعِيدٌ بِلِقَائِكَ", "Tanishganimdan xursandman"],
            ["أَهْلًا وَسَهْلًا", "Xush kelibsiz"],
            ["إِلَى اللِّقَاءِ", "Ko‘rishguncha"],
            ["مَعَ السَّلَامَةِ", "Xayr, omon bo‘ling"],
            ["بِخَيْرٍ", "Yaxshi, sog‘-salomat"]

        },
        {

          subtitle: "Oila va qarindoshlar",
          vocab: [

            ["مُتَقَاعِدٌ", "Pensioner, nafaqaxo‘r"],
            ["سَمِينٌ", "Semiz, to‘la"],
            ["يَع
